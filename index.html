<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers: Doomsday</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Arial, Helvetica, sans-serif;

            /* Fondo estilo Bonnie */
            background:
                radial-gradient(circle at center,
                    #39265f 0%,
                    #211735 30%,
                    #100c1c 65%,
                    #030207 100%);
        }

        /* Brillo morado */
        .luz {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(111, 54, 161, 0.25);
            filter: blur(120px);
            animation: pulso 4s infinite alternate;
        }

        @keyframes pulso {
            from {
                transform: scale(0.8);
                opacity: 0.3;
            }

            to {
                transform: scale(1.3);
                opacity: 0.7;
            }
        }

        /* Líneas de luz */
        .luz2 {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #7545a8;
            box-shadow: 0 0 20px #8d55c7;
            opacity: 0.35;
            top: 50%;
        }

        .contenedor {
            position: relative;
            z-index: 5;
            width: 90%;
            text-align: center;
            animation: entrada 3s ease-out;
        }

        @keyframes entrada {
            0% {
                opacity: 0;
                transform: scale(1.5);
                filter: blur(15px);
            }

            70% {
                opacity: 1;
                filter: blur(0);
            }

            100% {
                transform: scale(1);
            }
        }

        .marvel {
            font-size: 20px;
            letter-spacing: 9px;
            color: #aaa0bb;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .bonifacio {
            font-size: clamp(42px, 8vw, 105px);
            font-weight: 900;
            line-height: 0.95;
            letter-spacing: 5px;
            text-transform: uppercase;

            color: #eeeaff;

            text-shadow:
                0 0 8px #7650a8,
                0 0 20px #653c91,
                0 0 40px #4d2b70;

            animation: brillo 2.5s infinite alternate;
        }

        @keyframes brillo {
            from {
                text-shadow:
                    0 0 8px #7650a8,
                    0 0 20px #653c91;
            }

            to {
                text-shadow:
                    0 0 15px #a16bd0,
                    0 0 35px #70439b,
                    0 0 65px #4c2670;
            }
        }

        .regresara {
            color: #9b65c9;
        }

        .linea {
            width: 0;
            height: 3px;
            margin: 35px auto;
            background: #9c68ca;
            box-shadow:
                0 0 10px #9c68ca,
                0 0 25px #633c85;

            animation: expandir 2s forwards 1s;
        }

        @keyframes expandir {
            to {
                width: 70%;
            }
        }

        .subtitulo {
            font-size: clamp(16px, 3vw, 29px);
            letter-spacing: 6px;
            color: #c6bdd2;
            text-transform: uppercase;
        }

        /* Partículas */
        .particula {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #b48bd2;
            border-radius: 50%;
            box-shadow: 0 0 8px #9b65c9;
            opacity: 0.7;
            animation: caer linear infinite;
        }

        @keyframes caer {
            from {
                transform: translateY(-100vh);
            }

            to {
                transform: translateY(100vh);
            }
        }

        .p1 { left: 8%; animation-duration: 8s; }
        .p2 { left: 20%; animation-duration: 11s; }
        .p3 { left: 35%; animation-duration: 7s; }
        .p4 { left: 50%; animation-duration: 10s; }
        .p5 { left: 68%; animation-duration: 8s; }
        .p6 { left: 82%; animation-duration: 12s; }
        .p7 { left: 94%; animation-duration: 9s; }

        .aviso {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: #756b82;
            font-size: 11px;
            letter-spacing: 4px;
        }

    </style>
</head>

<body>

    <div class="luz"></div>
    <div class="luz2"></div>

    <div class="particula p1"></div>
    <div class="particula p2"></div>
    <div class="particula p3"></div>
    <div class="particula p4"></div>
    <div class="particula p5"></div>
    <div class="particula p6"></div>
    <div class="particula p7"></div>

    <div class="contenedor">

        <div class="marvel">
            FREDDY´S PRESENTA
        </div>

        <div class="bonifacio">
            BONIFACIO<br>
            <span class="regresara">REGRESARÁ</span>
        </div>

        <div class="linea"></div>

        <div class="subtitulo">
            EN AVENGERS: DOOMSDAY
        </div>

    </div>

    <div class="aviso">
        LISTO PARA FARMEAR MÁS AURA QUE DOOM...
    </div>

</body>
</html>
